<style>
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --ink:#1C2630; --muted:#5A6774; --line:#CDD4DA;
  --brand:#1E8C45; --brand-ink:#FFFFFF; --chip:#FFFFFF;
  --head:#1C2630; --head-ink:#FFFFFF; --head-mute:#AAB6C1; --tag:#F2C230; --lime:#8CC63F;
  --ok:#1E7B4C; --warn:#A86200; --bad:#B3261E; --info:#2B5FA6; --grey:#5A6774;
  --ghs:#E3000F; --radius:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10171D; --surface:#1A242D; --ink:#E6EDF2; --muted:#9AA8B4; --line:#2C3A46;
    --brand:#3FB867; --brand-ink:#06200F; --chip:#1A242D;
    --head:#0B1117; --head-ink:#FFFFFF; --head-mute:#8E9BA7; --tag:#F2C230; --lime:#8CC63F;
    --ok:#4CC38A; --warn:#F0A53A; --bad:#FF6B6B; --info:#7FA8E8; --grey:#9AA8B4;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:12px;padding:12px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.brand{flex:1;min-width:0}
.logo{height:48px;width:auto;border-radius:8px;background:#fff;flex:none}
.brand .t{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .s{font-size:12px;opacity:.85}
.sync{font-size:12px;opacity:.9;text-align:right;max-width:40vw}
.icon-btn{border:0;background:rgba(255,255,255,.16);color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:12px 12px 96px}
.searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,70px));z-index:10;background:var(--bg);padding:4px 0 10px}
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 16px;font-size:17px}
.search:focus{border-color:var(--brand);outline:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.chip .n{opacity:.7;margin-left:4px}

.group-h{font-size:14px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
.list{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.row:active{background:var(--chip)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:16px}
.row-sub{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:2px;flex:none}
.chev{color:var(--muted);flex:none}

.empty{padding:32px 16px;text-align:center;color:var(--muted)}
/* Numéros d'urgence */
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.sos a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;background:#C62828;color:#fff;border-radius:12px;padding:8px 4px;min-height:56px;text-align:center}
.sos a b{font-size:20px;line-height:1.1;letter-spacing:.02em}
.sos a span{font-size:12px;opacity:.95}
.sos a.wide{grid-column:1/-1;min-height:52px}
.sos a.wide b{font-size:20px;white-space:nowrap}
.cli-search{top:62px;margin-top:10px}
.filter-l{font-size:12px;font-weight:700;color:var(--muted);margin:2px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.pdp-h .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.pdp-kv{margin:8px 0 4px;grid-template-columns:72px 1fr}
.pdp-kv dt{font-size:13px;padding-top:1px}
.sos-note{font-size:12px;color:var(--muted);margin:0 2px 8px}
.sos-note a{color:inherit}
/* Appel */
.call{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--ok);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.call svg{width:18px;height:18px}
.urg-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.urg-row:first-child{border-top:0}
.ask{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:18px;text-align:center;color:var(--muted);font-size:14px}
.ask .btn{margin-top:10px}
.seg .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Onglets bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--head-ink);font-weight:700;box-shadow:inset 0 3px 0 var(--tag)}

/* Panneau détail */
.panel{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-top{position:sticky;top:0;z-index:2;background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:10px;padding:10px 12px}
.panel-top h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{max-width:760px;margin:0 auto;padding:16px 14px 40px}

.title{font-size:24px;font-weight:700;line-height:1.2;margin:0 0 4px}
.lead{font-size:17px;margin:0 0 2px}
.muted{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ref{font-size:12px;font-weight:600;color:var(--brand);white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.refs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.refs dt{font-weight:700;color:var(--brand);white-space:nowrap}
.refs dd{margin:0}
.ref-box{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:4px}
.pre{white-space:pre-wrap;margin:0}

.mention{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:8px;font-weight:800;font-size:15px;letter-spacing:.04em}
.mention.danger{background:var(--ghs);color:#fff}
.mention.attention{background:#FFB300;color:#2A1A00}
.pictos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.picto{text-align:center;font-size:13px;line-height:1.25}
.picto svg{display:block;margin:0 auto 4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--radius);padding:16px;font-size:17px;font-weight:700;text-decoration:none;background:var(--brand);color:var(--brand-ink);margin-top:16px}
.btn.secondary{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:2px solid var(--bad)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn svg{width:22px;height:22px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:10px}

.pdp-h{font-size:15px;font-weight:700;margin:20px 4px 6px}
.validity{font-weight:600}
.validity.bad{color:var(--bad)}
.validity.grey{color:var(--grey)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* Statuts */
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.b-ok{color:var(--ok)} .b-warn{color:var(--warn)} .b-bad{color:var(--bad)} .b-info{color:var(--info)} .b-grey{color:var(--grey)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:13px;color:var(--muted)}

/* Gestion */
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;font-size:14px;padding:10px 4px;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.admin-tools{display:flex;gap:10px;margin:4px 0 0}
.admin-tools .btn{margin-top:0;padding:12px;font-size:15px}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.input{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:84px;resize:vertical}
.inline{display:flex;gap:8px}
.inline .input{flex:1;min-width:0}
.mini-btn{flex:none;border:0;background:var(--chip);border-radius:10px;padding:0 14px;font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.check input{width:22px;height:22px}
.picto-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.picto-pick label{border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;background:var(--surface)}
.picto-pick input{position:absolute;opacity:0;pointer-events:none}
.picto-pick input:checked + span{color:var(--brand);font-weight:700}
.picto-pick label:has(input:checked){border-color:var(--brand);background:var(--chip)}
.picto-pick input:focus-visible + span{outline:3px solid var(--brand)}

/* Fenêtre (code, Drive) */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 6px;font-size:20px}
.pin{display:block;margin:18px auto 6px;width:200px;text-align:center;font-size:34px;letter-spacing:.5em;padding:12px 0 12px .5em;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.pin:focus{border-color:var(--brand);outline:none}
.err{color:var(--bad);text-align:center;min-height:22px;font-size:14px;font-weight:600}
.drive-item{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 4px}
.drive-item small{display:block;color:var(--muted)}
.drive-item.used{opacity:.55}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Style atelier (V3) */
.brand .t,.title,.panel-top h2,.group-h,.pdp-h,.sheet h2,.sos a b{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.01em}
.brand .t{font-size:23px;font-weight:700}
.brand .s{color:var(--head-mute);opacity:1;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.title{font-size:27px}
.panel-top h2{font-size:20px}
.icon-btn{background:rgba(255,255,255,.12)}
.tabs{background:var(--head);border-top:0}
.tab{color:#C3CDD6;font-weight:600}
.group-h{font-size:17px;color:var(--ink);display:flex;align-items:center;gap:8px;margin:20px 2px 8px}
.group-h::before{content:"";width:4px;height:16px;background:var(--lime);flex:none}
.pdp-h{font-size:18px;display:flex;align-items:center;gap:6px}
.pdp-h::before{content:"";width:4px;height:16px;background:var(--lime);flex:none}
.list{border:0;background:transparent;overflow:visible;display:flex;flex-direction:column;gap:6px}
.list .row,.list .urg-row{background:var(--surface);border-top:0;border-left:5px solid var(--brand);border-radius:var(--radius)}
.card{border:0;border-left:5px solid var(--brand)}
.card h3{font-family:Barlow,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.chip{border:1px solid var(--line);font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--brand)}
.search{border-width:2px}
.ask{border-style:dashed;border-width:2px}
.btn{font-weight:600;letter-spacing:.01em}
.badge{border-width:0;padding:3px 9px}
.b-ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.b-bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.b-info{background:color-mix(in srgb,var(--info) 14%,transparent)}
.b-grey{background:color-mix(in srgb,var(--grey) 14%,transparent)}
.seg{background:var(--surface);border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--head);color:var(--head-ink);box-shadow:none}
.mention.attention{background:var(--tag)}
.btn.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.mini-btn{background:var(--bg);border:1px solid var(--line)}
</style>
</head>

function epiPicto(code, size){
  const p = EPI[code]; if(!p) return '';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${p.l}"><circle cx="50" cy="50" r="47" fill="#005387"/><g fill="#fff">${p.g}</g></svg>`;
}
const epiCodes = s => String(s||'').split(',').map(x=>x.trim()).filter(c=>EPI[c]);

function picto(code, size){
  const p = GHS[code]; if(!p) return '';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${p.l}"><polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#E3000F" stroke-width="7"/><g fill="#000">${p.g}</g></svg>`;
}

};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fr = iso => iso ? iso.split('-').reverse().join('/') : '';
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysTo(iso){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/864e5); }
const cmp = (a,b) => String(a).localeCompare(String(b),'fr',{sensitivity:'base'});

/* ================== API (GET uniquement) ================== */
async function api(action, params={}){
  const u = new URL(API_URL);
  u.searchParams.set('action', action);
  for (const [k,v] of Object.entries(params)) u.searchParams.set(k, typeof v==='object' ? JSON.stringify(v) : v);
  const r = await fetch(u.toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Erreur serveur');
  return j;
}

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, ms); }
function setSync(msg){ $('#sync').textContent = msg; }

function loadCache(){

}
async function refresh(){
  if (!S.data) { $('#fdsList').innerHTML = $('#pdpList').innerHTML = '<div class="spinner"></div>'; }
  setSync('Mise à jour…');
  try{
    const j = await api('data');
    S.data = j;
    try{ localStorage.setItem('qsse_public', JSON.stringify(j)); }catch(e){}
    setSync('');
    renderAll();
  }catch(e){
    if (S.data) setSync('Données enregistrées sur le téléphone');
    else {
      setSync('');
      const msg = `<div class="empty"><b>Connexion impossible</b>Vérifiez le réseau puis rouvrez la page.</div>`;
      $('#fdsList').innerHTML = $('#pdpList').innerHTML = msg;
    }
  }
}

  </dl><p class="note">Numérotation de l’annexe II du règlement REACH, modifiée par le règlement (UE) 2020/878.</p></div>`;

}

const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4" /></svg>';

/* ================== PDP (techniciens) ================== */
function pdpOf(){ return (S.data && S.data.pdp) || []; }
function validityHtml(p){
  if (p.nonConcerne) return `<span class="validity grey">Pas de plan de prévention requis</span>`;
  if (!p.fin) return `<span class="validity grey">Validité non connue</span>`;
  if (daysTo(p.fin) < 0) return `<span class="validity bad">Expiré depuis le ${fr(p.fin)}</span>`;
  return `<span class="validity">Valide ${p.debut ? 'du '+fr(p.debut)+' ' : ''}jusqu’au ${fr(p.fin)}</span>`;
}
function renderPdp(){
  if (!S.data) return;
  const q = norm($('#pdpSearch').value.trim());
  const items = pdpOf().filter(p => !q || norm([p.client,p.site,p.secteur,p.numero,p.nature].join(' ')).includes(q));
  if (!items.length){ $('#pdpList').innerHTML = `<div class="empty"><b>Aucun client trouvé</b>Essayez le nom du client, du site ou le n° de PDP.</div>`; return; }
  const clients = {};
  items.forEach(p => (clients[p.client] = clients[p.client] || []).push(p));
  $('#pdpList').innerHTML = `<div class="list" style="margin-top:4px">${Object.keys(clients).sort(cmp).map(c => {
    const l = clients[c];
    const all = pdpOf().filter(p=>p.client===c);
    const sites = [...new Set(all.map(p=>p.site).filter(Boolean))].sort(cmp);
    const subSites = sites.length ? `<div class="row-sub">${sites.length>1?'Sites':'Site'} : ${esc(sites.join(', '))}</div>` : '';
    const nb = `<div class="row-sub">${all.length} plan${all.length>1?'s':''} de prévention${l.length<all.length ? ' (' + l.length + ' correspondant' + (l.length>1?'s':'') + ' à la recherche)' : ''}</div>`;
    return `<button class="row" data-client="${esc(c)}"><div class="row-main"><div class="row-title">${esc(c)}</div>${subSites}${nb}</div><span class="chev">›</span></button>`;
  }).join('')}</div>`;
  const raw = $('#pdpSearch').value.trim();
  $('#pdpList').querySelectorAll('[data-client]').forEach(b => b.onclick = () => showClient(b.dataset.client, q && !norm(b.dataset.client).includes(q) ? raw : ''));
}
$('#pdpSearch').addEventListener('input', renderPdp);

function showClient(client, preQuery=''){
  const l = pdpOf().filter(p=>p.client===client)
    .sort((a,b)=>cmp(a.site,b.site)||cmp(a.secteur,b.secteur)||cmp(a.numero,b.numero));
  let h = `<h1 class="title">${esc(client)}</h1>`;
  const urg = urgOf().filter(u => norm(u.client)===norm(client));
  if (urg.length) h += `<div class="card" style="padding:0;overflow:hidden"><h3 style="padding:14px 16px 0">Numéros d’urgence du client</h3>${urg.map(urgRowHtml).join('')}</div>`;
  const sites = [...new Set(l.map(p=>p.site).filter(Boolean))].sort(cmp);
  if (l.length > 1){
    h += `<div class="searchbar cli-search"><input id="cliSearch" class="search" type="search" placeholder="Site, secteur, n° de PDP, travaux…" autocomplete="off" aria-label="Rechercher dans les PDP du client" value="${esc(preQuery)}"></div>`;
    if (sites.length > 1) h += `<p class="filter-l">Filtrer par site</p><div class="chips" id="cliSites">${['Tous', ...sites].map(x => `<button class="chip" data-site="${esc(x)}" aria-pressed="${x==='Tous'}">${esc(x)}<span class="n">${x==='Tous' ? l.length : l.filter(p=>p.site===x).length}</span></button>`).join('')}</div>`;
  }
  h += `<div id="cliList"></div>`;
  openPanel('Plans de prévention', h);
  let site = 'Tous';
  const draw = () => {
    const q = norm(($('#cliSearch') || {value:''}).value.trim());
    const items = l.filter(p => (site==='Tous' || p.site===site) && (!q || norm([p.site,p.secteur,p.numero,p.nature].join(' ')).includes(q)));
    if (!items.length){ $('#cliList').innerHTML = `<div class="empty"><b>Aucun PDP trouvé</b>Essayez le site, le secteur ou le n° de PDP.</div>`; return; }
    let out = '', last = null;
    items.forEach(p => {
      const site = p.site || '';
      if (sites.length && site!==last){ out += `<div class="pdp-h"><span class="lbl">Site</span> ${esc(site || 'non précisé')}</div>`; last = site; }
      out += `<div class="card">
        <div class="lead"><b>${p.numero ? 'PDP n° '+esc(p.numero) : 'N° de PDP non connu'}</b></div>
        <dl class="kv pdp-kv">
          ${p.secteur ? `<dt>Secteur</dt><dd>${esc(p.secteur)}</dd>` : ''}
          <dt>Validité</dt><dd>${validityHtml(p)}</dd>
          ${p.nature ? `<dt>Travaux</dt><dd class="pre">${esc(p.nature)}</dd>` : ''}
        </dl>
        ${p.nonConcerne ? '' : (p.lien
          ? `<a class="btn" href="${esc(p.lien)}" target="_blank" rel="noopener">${ICON_DOC} Ouvrir le PDP</a>`
          : `<span class="btn secondary" aria-disabled="true">Fichier non disponible</span>`)}
      </div>`;
    });
    if (items.length < l.length) out = `<p class="muted" style="margin:8px 4px 0">${items.length} PDP sur ${l.length}</p>` + out;
    $('#cliList').innerHTML = out;
  };
  if ($('#cliSearch')) $('#cliSearch').addEventListener('input', draw);
  if ($('#cliSites')) $('#cliSites').querySelectorAll('[data-site]').forEach(b => b.onclick = () => {
    site = b.dataset.site;
    $('#cliSites').querySelectorAll('[data-site]').forEach(x => x.setAttribute('aria-pressed', x===b));
    draw();
  });
  draw();
}

$('#lockBtn').onclick = () => {

  openModal(`<h2>Espace gestion</h2><p class="muted">Saisissez le code à 4 chiffres.</p>
    <input id="pinInput" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code">
    <div class="err" id="pinErr"></div>`);
  const inp = $('#pinInput'); inp.focus();
  inp.oninput = async () => {
    inp.value = inp.value.replace(/\D/g,'').slice(0,4);
    if (inp.value.length < 4) { $('#pinErr').textContent=''; return; }
    inp.disabled = true; $('#pinErr').textContent = '';
    try{
      await api('login', {pin:inp.value});
      S.pin = inp.value; sessionStorage.setItem('qsse_pin', S.pin);
      $('#adminTab').hidden = false;
      back(); showView('admin');
    }catch(e){
      $('#pinErr').textContent = e.message==='Code incorrect' ? 'Code incorrect' : 'Connexion impossible';
      inp.disabled=false; inp.value=''; inp.focus();
    }
  };
};

async function loadAdmin(){
  $('#adminBody').innerHTML = '<div class="spinner"></div>';
  try{ S.admin = await api('admin', {pin:S.pin}); }
  catch(e){
    if (e.message==='Code incorrect'){ S.pin=''; sessionStorage.removeItem('qsse_pin'); $('#adminTab').hidden=true; showView('fds'); toast('Le code a changé : saisissez-le à nouveau.'); return false; }
    $('#adminBody').innerHTML = `<div class="empty"><b>Connexion impossible</b>${esc(e.message)}</div>`; return false;
  }
  return true;
}
async function renderAdmin(reload=true){
  if (reload || !S.admin){ if (!(await loadAdmin())) return; }
  const n = (S.admin.demandes||[]).filter(d=>d.statut!=='Traitée').length;
  $('#demCount').hidden = !n; $('#demCount').textContent = n;
  ({pdp:renderAdminPdp, fds:renderAdminFds, urg:renderAdminUrg, dem:renderAdminDem}[S.atab] || renderAdminPdp)();
}

/* ---------- Gestion PDP ---------- */
const ST = {
  expire:{l:'Expiré',c:'b-bad'}, renouv:{l:'À renouveler',c:'b-warn'}, envoye:{l:'Envoyé au client',c:'b-info'},
  inconnu:{l:'Non connu',c:'b-grey'}, valide:{l:'Valide',c:'b-ok'}, nc:{l:'Non concerné',c:'b-grey'}
};
function statut(p){
  const seuil = S.admin.seuil;
  if (p.nonConcerne) return 'nc';
  if (!p.fin) return 'inconnu';
  const j = daysTo(p.fin);
  if (j < 0) return 'expire';
  if (j <= seuil) return p.renouvEnvoye ? 'envoye' : 'renouv';
  return 'valide';
}
const FILTERS = [
  ['traiter','À traiter', s => s==='expire'||s==='renouv'],
  ['envoye','Envoyé au client', s => s==='envoye'],
  ['inconnu','Non connu', s => s==='inconnu'],
  ['valide','Valide', s => s==='valide'],
  ['nc','Non concerné', s => s==='nc'],
  ['tous','Tous', () => true]
];
function renderAdminPdp(){
  const all = S.admin.pdp.map(p => ({...p, st:statut(p)}));
  const f = FILTERS.find(x=>x[0]===S.afilter) || FILTERS[0];
  const rank = {expire:0,renouv:1,envoye:2,inconnu:3,valide:4,nc:5};
  const q = norm(S.apdp || '');
  const match = p => !q || norm([p.client,p.site,p.secteur,p.numero,p.nature,p.contact,p.remarques].join(' ')).includes(q);
  const list = all.filter(p=>f[2](p.st) && match(p)).sort((a,b)=> rank[a.st]-rank[b.st] || cmp(a.fin||'9999',b.fin||'9999') || cmp(a.client,b.client));
  let h = `<input class="search" id="aPdpSearch" type="search" placeholder="Client, site, secteur, n° de PDP, contact…" value="${esc(S.apdp||'')}" aria-label="Rechercher un PDP" style="margin-bottom:12px">`;
  h += `<div class="chips">${FILTERS.map(x => `<button class="chip" data-af="${x[0]}" aria-pressed="${x[0]===S.afilter}">${x[1]}<span class="n">${all.filter(p=>x[2](p.st) && match(p)).length}</span></button>`).join('')}</div>`;
  h += `<div class="admin-tools"><button class="btn" id="addPdp">Ajouter un PDP</button><button class="btn secondary" id="runRelance">Vérifier les relances</button></div>`;
  h += list.length ? `<div class="list" style="margin-top:12px">${list.map(p => {
    const j = p.fin ? daysTo(p.fin) : null;
    const when = j===null ? '' : (j<0 ? `depuis ${-j} j` : `J-${j}`);
    return `<button class="row" data-pid="${esc(p.id)}">
      <div class="row-main"><div class="row-title">${esc(p.client)}</div>
      ${p.site||p.secteur ? `<div class="row-sub">${p.site?'Site : '+esc(p.site):''}${p.site&&p.secteur?' | ':''}${p.secteur?'Secteur : '+esc(p.secteur):''}</div>` : ''}
      <div class="row-sub">${p.numero ? 'PDP n° '+esc(p.numero) : 'N° non connu'}${p.fin ? ', fin le '+fr(p.fin) : ''}</div></div>
      <div class="side"><span class="badge ${ST[p.st].c}">${ST[p.st].l}</span>${p.st!=='valide'&&p.st!=='nc'?when:''}</div>
    </button>`; }).join('')}</div>`
    : `<div class="empty"><b>${q ? 'Aucun PDP trouvé' : 'Rien dans cette catégorie'}</b>${q ? 'Essayez un autre mot, ou le filtre « Tous ».' : (S.afilter==='traiter' ? 'Aucun PDP n’arrive à échéance dans les '+S.admin.seuil+' prochains jours.' : '')}</div>`;
  $('#adminBody').innerHTML = h;
  const sIn = $('#aPdpSearch');
  sIn.oninput = () => { S.apdp = sIn.value; const pos = sIn.selectionStart; renderAdminPdp(); const n = $('#aPdpSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#adminBody').querySelectorAll('[data-af]').forEach(b => b.onclick = () => { S.afilter=b.dataset.af; renderAdminPdp(); });
  $('#adminBody').querySelectorAll('[data-pid]').forEach(b => b.onclick = () => editPdp(b.dataset.pid));
  $('#addPdp').onclick = () => editPdp(null);
  $('#runRelance').onclick = async (e) => {
    e.target.disabled = true;
    try{ const r = await api('relances',{pin:S.pin}); toast(r.envoyes ? r.envoyes+' PDP relancé(s) par mail' : 'Aucune nouvelle relance à envoyer'); renderAdmin(); }
    catch(err){ toast(err.message); e.target.disabled=false; }
  };
}

function datalist(id, values){ return `<datalist id="${id}">${[...new Set(values.filter(Boolean))].sort(cmp).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`; }
function fld(label, name, value, opts={}){
  const t = opts.type || 'text';
  const attrs = `id="f_${name}" name="${name}" class="input" ${opts.list?`list="${opts.list}"`:''} ${opts.req?'required':''} ${opts.ph?`placeholder="${esc(opts.ph)}"`:''}`;
  const input = t==='textarea' ? `<textarea ${attrs}>${esc(value)}</textarea>` : `<input type="${t}" ${attrs} value="${esc(value)}">`;
  const body = opts.after ? `<div class="inline">${input}${opts.after}</div>` : input;
  return `<div class="field"><label for="f_${name}">${label}</label>${body}${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
}
function formVals(){
  const o = {};
  $('#panelBody').querySelectorAll('[name]').forEach(el => {
    if (el.type==='checkbox' && el.dataset.multi) { if (el.checked) (o[el.name] = o[el.name] || []).push(el.value); }
    else if (el.type==='checkbox') o[el.name] = el.checked;
    else o[el.name] = el.value.trim();
  });
  return o;
}
function watchDirty(){ $('#panelBody').querySelectorAll('input,textarea,select').forEach(el => el.addEventListener('input', () => S.dirty = true)); }
function mailtoClient(p){
  if (!p.contact) return '';
  const to = p.contact.split(/[;,\s]+/).filter(Boolean).join(',');
  const sujet = 'Mise à jour du plan de prévention — PAGANETTI THERMIQUE' + (p.numero ? ' (PDP '+p.numero+')' : '');
  const corps = `Bonjour,\n\nLe plan de prévention ${p.numero ? 'n° '+p.numero+' ' : ''}concernant nos interventions${p.site ? ' sur le site de '+p.site : ''}${p.fin ? ' arrive à échéance le '+fr(p.fin) : ' doit être mis à jour'}.\n\nPourriez-vous nous indiquer les modalités de sa mise à jour (date d’inspection commune, documents à fournir) ?\n\nCordialement,\n\nAlan BELLET\nResponsable QSSE — PAGANETTI THERMIQUE`;
  return `mailto:${to}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
}

function editPdp(id){
  const p = id ? S.admin.pdp.find(x=>x.id===id) : {client:'',site:'',secteur:'',numero:'',debut:'',fin:'',nature:'',lien:'',contact:'',envoi:'',retour:'',renouvEnvoye:'',nonConcerne:false,remarques:''};
  const all = S.admin.pdp;
  const st = id ? statut(p) : null;
  let h = id ? `<p style="margin:0 0 4px"><span class="badge ${ST[st].c}">${ST[st].l}</span></p>` : '';
  h += datalist('dlClient', all.map(x=>x.client)) + datalist('dlSite', all.map(x=>x.site)) + datalist('dlSecteur', all.map(x=>x.secteur));
  h += fld('Client *','client',p.client,{list:'dlClient',req:true});
  h += `<div class="two">${fld('Site','site',p.site,{list:'dlSite'})}${fld('Secteur','secteur',p.secteur,{list:'dlSecteur'})}</div>`;
  h += fld('N° de PDP','numero',p.numero,{hint:'Laisser vide si non connu.'});
  h += `<div class="two">${fld('Date de début','debut',p.debut,{type:'date'})}${fld('Date de fin','fin',p.fin,{type:'date'})}</div>`;
  h += fld('Nature des travaux','nature',p.nature,{type:'textarea'});
  h += fld('Lien du fichier PDP','lien',p.lien,{type:'url',ph:'https://drive.google.com/…',
        after: S.admin.drivePdp ? `<button type="button" class="mini-btn" id="pickPdp">Drive</button>` : ''});
  h += `<div class="card"><h3>Encadrement</h3>`;
  h += fld('Contact client','contact',p.contact,{hint:'Plusieurs adresses : séparer par un point-virgule.'});
  h += fld('Demande de mise à jour envoyée le','renouvEnvoye',p.renouvEnvoye,{type:'date',
        after:`<button type="button" class="mini-btn" id="setToday">Aujourd’hui</button>`,
        hint:'Passe le PDP en « Envoyé au client ». Effacé automatiquement quand la date de fin change.'});
  h += `<div class="two">${fld('Envoyé au client le','envoi',p.envoi,{type:'date'})}${fld('Retour client le','retour',p.retour,{type:'date'})}</div>`;
  h += `<div class="hint" style="margin-top:6px">Preuve de transmission du PDP en cours.</div>`;
  h += fld('Remarques','remarques',p.remarques,{type:'textarea'});
  h += `<label class="check"><input type="checkbox" name="nonConcerne" ${p.nonConcerne?'checked':''}> Non concerné (pas de PDP requis)</label>`;
  h += `</div>`;
  const mt = id ? mailtoClient(p) : '';
  if (mt) h += `<a class="btn secondary" href="${esc(mt)}">Préparer le mail au client</a>`;
  h += `<button class="btn" id="savePdp">Enregistrer</button>`;
  if (id) h += `<button class="btn danger" id="delPdp">Supprimer ce PDP</button>`;
  openPanel(id ? 'Modifier le PDP' : 'Nouveau PDP', h);
  watchDirty();
  $('#setToday').onclick = () => { $('#f_renouvEnvoye').value = todayIso(); S.dirty = true; };
  if ($('#pickPdp')) $('#pickPdp').onclick = () => drivePicker('pdp', f => { $('#f_lien').value = f.url; S.dirty = true; });
  $('#savePdp').onclick = async (e) => {
    const v = formVals();
    if (!v.client){ toast('Le client est obligatoire'); return; }
    if (v.debut && v.fin && v.fin < v.debut){ toast('La date de fin précède la date de début'); return; }
    e.target.disabled = true; e.target.textContent = 'Enregistrement…';
    try{ await api('savePdp',{pin:S.pin, p:{...v, id:id||''}}); S.dirty=false; back(); toast('PDP enregistré'); renderAdmin(); refresh(); }
    catch(err){ toast(err.message); e.target.disabled=false; e.target.textContent='Enregistrer'; }
  };
  if (id) $('#delPdp').onclick = async () => {
    if (!confirm('Supprimer définitivement ce PDP de l’outil ?')) return;
    try{ await api('deletePdp',{pin:S.pin,id}); S.dirty=false; back(); toast('PDP supprimé'); renderAdmin(); refresh(); }
    catch(err){ toast(err.message); }
  };
}

function renderAdminFds(){
  const q = norm(S.afds || '');
  const list = S.admin.fds.filter(f => !q || norm([f.nom,f.utilite,f.fabricant,f.famille].join(' ')).includes(q))
    .sort((a,b)=>cmp(a.famille,b.famille)||cmp(a.nom,b.nom));
  let h = `<input class="search" id="aFdsSearch" type="search" placeholder="Rechercher un produit…" value="${esc(S.afds||'')}" aria-label="Rechercher un produit">`;
  h += `<div class="admin-tools" style="margin-top:12px"><button class="btn" id="addFds">Ajouter un produit</button></div>`;
  h += list.length ? `<div class="list" style="margin-top:12px">${list.map(f => `
    <button class="row" data-fid="${esc(f.id)}"><div class="row-main"><div class="row-title">${esc(f.nom)}</div>
    <div class="row-sub">${esc(f.famille)}${f.fabricant?', '+esc(f.fabricant):''}</div></div>
    <div class="side">${f.lien ? '' : '<span class="badge b-warn">FDS non liée</span>'}</div></button>`).join('')}</div>`
    : `<div class="empty"><b>${S.admin.fds.length ? 'Aucun produit trouvé' : 'Aucun produit pour l’instant'}</b>${S.admin.fds.length ? '' : 'Ajoutez votre premier produit.'}</div>`;
  $('#adminBody').innerHTML = h;
  const s = $('#aFdsSearch');
  s.oninput = () => { S.afds = s.value; const pos=s.selectionStart; renderAdminFds(); const n=$('#aFdsSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#adminBody').querySelectorAll('[data-fid]').forEach(b => b.onclick = () => editFds(b.dataset.fid));
  $('#addFds').onclick = () => editFds(null);
}

function editFds(id, prefill={}){
  const f = id ? S.admin.fds.find(x=>x.id===id) : {famille:'',utilite:'',nom:prefill.nom||'',fabricant:prefill.fabricant||'',pictos:'',mention:'',epi:'',phrasesH:'',secours:'',lien:''};
  const sel = (f.pictos||'').split(',').map(s=>s.trim());
  const selEpi = epiCodes(f.epi);
  let h = `<div class="ref-box">Repères conformes à l’annexe II de REACH modifiée par le règlement (UE) 2020/878. Pensez à vérifier la date de révision en première page de la FDS.</div>`;
  h += fld('Lien de la FDS','lien',f.lien,{type:'url',ph:'https://drive.google.com/…',
        after: S.admin.driveFds ? `<button type="button" class="mini-btn" id="pickFds">Drive</button>` : '',
        hint: S.admin.driveFds ? 'Choisir le fichier dans le Drive remplit aussi l’utilité, le nom et le fabricant.' : ''});
  h += `<div class="field"><label for="f_famille">Famille *</label><select id="f_famille" name="famille" class="input">
        <option value="">Choisir…</option>${S.admin.familles.map(x=>`<option ${x===f.famille?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  h += fld('Utilité du produit','utilite',f.utilite,{ph:'Détecteur de fuite',hint:'FDS rubrique 1.2 : utilisations identifiées.'});
  h += `<div class="two">${fld('Nom commercial *','nom',f.nom,{ph:'DF79',req:true,hint:'Rubrique 1.1'})}${fld('Fabricant','fabricant',f.fabricant,{ph:'TECHNOUTIL',hint:'Rubrique 1.3'})}</div>`;
  h += `<div class="field"><label>Pictogrammes de danger</label><div class="hint" style="margin:0 0 8px">FDS rubrique 2.2 : éléments d’étiquetage.</div><div class="picto-pick">${Object.keys(GHS).map(c => `
        <label><input type="checkbox" name="pictos" data-multi="1" value="${c}" ${sel.includes(c)?'checked':''}><span>${picto(c,52)}<br>${esc(GHS[c].l)}</span></label>`).join('')}</div></div>`;
  h += `<div class="field"><label for="f_mention">Mention d’avertissement <span class="hint">(rubrique 2.2)</span></label><select id="f_mention" name="mention" class="input">
        ${['','Attention','Danger'].map(x=>`<option value="${x}" ${norm(x)===norm(f.mention)?'selected':''}>${x||'Aucune'}</option>`).join('')}</select></div>`;
  h += `<div class="field"><label>EPI à porter</label><div class="hint" style="margin:0 0 8px">FDS rubrique 8.2.2 : a) yeux et visage, b) mains et peau, c) voies respiratoires, d) dangers thermiques. Le conseil de prudence P280 en rubrique 2.2 donne aussi un premier repère.</div>
        <div class="picto-pick">${Object.keys(EPI).map(c => `
        <label><input type="checkbox" name="epi" data-multi="1" value="${c}" ${selEpi.includes(c)?'checked':''}><span>${epiPicto(c,52)}<br>${esc(EPI[c].l)}</span></label>`).join('')}</div></div>`;
  h += fld('Mentions de danger (facultatif)','phrasesH',f.phrasesH,{type:'textarea',ph:'H222 Aérosol extrêmement inflammable',hint:'Rubrique 2.2 (texte complet en rubrique 16).'});
  h += fld('Premiers secours (facultatif)','secours',f.secours,{type:'textarea',hint:'Rubrique 4.1 : description des mesures de premiers secours.'});
  h += `<button class="btn" id="saveFds">Enregistrer</button>`;
  if (id) h += `<button class="btn danger" id="delFds">Supprimer ce produit</button>`;
  openPanel(id ? 'Modifier le produit' : 'Nouveau produit', h);
  watchDirty();
  if ($('#pickFds')) $('#pickFds').onclick = () => drivePicker('fds', file => {
    $('#f_lien').value = file.url;
    const parts = file.name.replace(/\.[a-z0-9]{2,4}$/i,'').split(/\s+[–—-]\s+/).map(s=>s.trim());
    if (parts.length >= 3){
      if (!$('#f_utilite').value) $('#f_utilite').value = parts[0];
      if (!$('#f_nom').value) $('#f_nom').value = parts.slice(1,-1).join(' - ');
      if (!$('#f_fabricant').value) $('#f_fabricant').value = parts[parts.length-1];
    } else if (!$('#f_nom').value) $('#f_nom').value = parts.join(' - ');
    const top = norm(file.folder.split(' / ')[0]);
    const fam = S.admin.familles.find(x => norm(x)===top || (top && (norm(x).startsWith(top) || top.startsWith(norm(x)))));
    if (fam && !$('#f_famille').value) $('#f_famille').value = fam;
    S.dirty = true;
  });
  $('#saveFds').onclick = async (e) => {
    const v = formVals();
    v.pictos = (v.pictos||[]).join(',');
    v.epi = (v.epi||[]).join(',');
    if (!v.famille || !v.nom){ toast('Famille et nom commercial obligatoires'); return; }
    e.target.disabled = true; e.target.textContent = 'Enregistrement…';
    try{
      await api('saveFds',{pin:S.pin, p:{...v, id:id||''}});
      if (prefill.demandeId) await api('traiterDemande',{pin:S.pin, id:prefill.demandeId, statut:'Traitée'});
      S.dirty=false; back(); toast(prefill.demandeId ? 'Produit enregistré, demande marquée traitée' : 'Produit enregistré'); renderAdmin(); refresh();
    }
    catch(err){ toast(err.message); e.target.disabled=false; e.target.textContent='Enregistrer'; }
  };
  if (id) $('#delFds').onclick = async () => {
    if (!confirm('Supprimer ce produit de l’outil ? Le fichier Drive n’est pas supprimé.')) return;
    try{ await api('deleteFds',{pin:S.pin,id}); S.dirty=false; back(); toast('Produit supprimé'); renderAdmin(); refresh(); }
    catch(err){ toast(err.message); }
  };
}

/* ---------- Sélecteur de fichiers Drive ---------- */
const driveId = url => (String(url).match(/\/d\/([\w-]{20,})/) || String(url).match(/[?&]id=([\w-]{20,})/) || [])[1] || '';
async function drivePicker(type, onPick){
  openModal(`<h2>Choisir dans le Drive</h2><div class="spinner"></div>`);
  let files;
  try{ files = (await api('drive',{pin:S.pin,type})).files; }
  catch(e){ $('#modalBody').innerHTML = `<h2>Choisir dans le Drive</h2><p class="err">${esc(e.message)}</p>`; return; }
  const used = new Set((type==='pdp' ? S.admin.pdp : S.admin.fds).map(x=>driveId(x.lien)).filter(Boolean));
  const draw = q => {
    const l = files.filter(f => !q || norm(f.folder+' '+f.name).includes(norm(q)));
    $('#driveList').innerHTML = l.length ? l.map(f => `<button class="drive-item ${used.has(f.id)?'used':''}" data-id="${esc(f.id)}">${esc(f.name)}<small>${esc(f.folder||'Dossier principal')}${used.has(f.id)?', déjà liée':''}</small></button>`).join('')
      : '<div class="empty">Aucun fichier trouvé.</div>';
    $('#driveList').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { const f = files.find(x=>x.id===b.dataset.id); back(); onPick(f); });
  };
  $('#modalBody').innerHTML = `<h2>Choisir dans le Drive</h2><input class="search" id="driveSearch" type="search" placeholder="Rechercher un fichier…" style="margin:10px 0"><div id="driveList"></div>`;
  $('#driveSearch').oninput = e => draw(e.target.value);
  draw('');
}


/* ================== URGENCES CLIENTS ================== */
const ICON_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
function urgOf(){ return (S.data && S.data.urgences) || []; }
function telHref(n){ let t = String(n||'').replace(/[^\d+]/g,''); if (/^[1-9]\d{8}$/.test(t)) t = '0'+t; return t; }
function telShow(n){ const t = telHref(n); return /^0\d{9}$/.test(t) ? t.replace(/(\d{2})(?=\d)/g,'$1 ') : String(n||''); }
function urgRowHtml(u){
  const sub = [u.site, u.remarque].filter(Boolean).join(' · ');
  return `<div class="urg-row"><div class="row-main"><div class="row-title">${esc(u.libelle||'Numéro d’urgence')}</div>${sub?`<div class="row-sub" style="white-space:normal">${esc(sub)}</div>`:''}</div>
    <a class="call" href="tel:${esc(telHref(u.numero))}">${ICON_TEL}${esc(telShow(u.numero))}</a></div>`;
}
function renderUrg(){
  if (!S.data) return;
  const q = norm($('#urgSearch').value.trim());
  const items = urgOf().filter(u => !q || norm([u.client,u.site,u.libelle,u.remarque].join(' ')).includes(q));
  if (!urgOf().length){ $('#urgList').innerHTML = `<div class="empty"><b>Aucun numéro pour l’instant</b>Les numéros d’urgence clients s’ajoutent depuis l’espace gestion.</div>`; return; }
  if (!items.length){ $('#urgList').innerHTML = `<div class="empty"><b>Aucun client trouvé</b>En cas d’urgence vitale, appelez le 15, le 18 ou le 112 (onglet FDS).</div>`; return; }
  const g = {};
  items.forEach(u => (g[u.client] = g[u.client] || []).push(u));
  $('#urgList').innerHTML = Object.keys(g).sort(cmp).map(c => `<div class="group-h">${esc(c)}</div>
    <div class="list">${g[c].sort((a,b)=>cmp(a.site,b.site)||cmp(a.libelle,b.libelle)).map(urgRowHtml).join('')}</div>`).join('');
}
$('#urgSearch').addEventListener('input', renderUrg);

/* ================== DEMANDE D'AJOUT DE FDS ================== */
function fileToDataUrl(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src = url;
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function openDemande(produit=''){
  let demandeur = ''; try{ demandeur = localStorage.getItem('qsse_demandeur') || ''; }catch(e){}
  let h = `<p class="muted" style="margin-bottom:4px">La demande part par mail au service QSSE, qui ajoutera la FDS dans l’outil.</p>`;
  h += fld('Nom du produit *','produit',produit,{req:true,ph:'Nom commercial inscrit sur l’emballage'});
  h += fld('Fabricant *','fabricant','',{req:true,ph:'Marque ou fabricant'});
  h += fld('Demandeur *','demandeur',demandeur,{req:true,ph:'Prénom Nom'});
  h += fld('Usage / chantier','usage','',{ph:'À quoi sert le produit, où est-il utilisé'});
  h += fld('Commentaire','commentaire','',{type:'textarea'});
  h += `<div class="field"><label for="f_photo">Photo de l’étiquette (facultatif)</label><input id="f_photo" type="file" accept="image/*" capture="environment" class="input"><div class="hint">Aide à identifier le bon produit et le bon fournisseur.</div></div>`;
  h += `<button class="btn" id="sendDem">Envoyer la demande</button>`;
  openPanel('Demander une FDS', h);
  watchDirty();
  $('#sendDem').onclick = async (e) => {
    const v = formVals(); delete v.photo;
    if (!v.produit || !v.fabricant || !v.demandeur){ toast('Produit, fabricant et demandeur sont obligatoires'); return; }
    const btn = e.target; btn.disabled = true; btn.textContent = 'Envoi…';
    try{ localStorage.setItem('qsse_demandeur', v.demandeur); }catch(x){}
    const ref = 'DEM-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
    const file = $('#f_photo').files[0];
    try{
      if (!file){
        await api('demandeFds', {p:{...v, ref}});
      } else {
        btn.textContent = 'Envoi de la photo…';
        const photo = await fileToDataUrl(file);
        await fetch(API_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'demandeFds', ...v, ref, photo})});
        let ok = false;
        for (let i=0; i<8 && !ok; i++){ await sleep(2000); try{ ok = (await api('checkDemande',{ref})).trouvee; }catch(x){} }
        if (!ok) throw new Error('Envoi non confirmé : vérifiez le réseau et renvoyez la demande');
      }
      S.dirty = false;
      $('#panelBody').innerHTML = `<div class="empty"><b>Demande envoyée</b>Le service QSSE a reçu votre demande pour « ${esc(v.produit)} ». La FDS apparaîtra dans l’outil une fois ajoutée.<button class="btn" onclick="history.back()">Retour aux FDS</button></div>`;
    }catch(err){ toast(err.message); btn.disabled = false; btn.textContent = 'Envoyer la demande'; }
  };
}
$('#askFds').onclick = () => openDemande($('#fdsSearch').value.trim());

/* ---------- Gestion urgences clients ---------- */
function renderAdminUrg(){
  const list = (S.admin.urgences||[]).slice().sort((a,b)=>cmp(a.client,b.client)||cmp(a.site,b.site)||cmp(a.libelle,b.libelle));
  let h = `<div class="admin-tools"><button class="btn" id="addUrg">Ajouter un numéro</button></div>`;
  h += list.length ? `<div class="list" style="margin-top:12px">${list.map(u => `
    <button class="row" data-uid="${esc(u.id)}"><div class="row-main"><div class="row-title">${esc(u.client)}${u.site?', '+esc(u.site):''}</div>
    <div class="row-sub">${esc(u.libelle||'Numéro d’urgence')} : ${esc(telShow(u.numero))}</div></div><span class="chev">›</span></button>`).join('')}</div>`
    : `<div class="empty"><b>Aucun numéro pour l’instant</b>Ajoutez le PC sécurité ou le poste de garde de vos clients.</div>`;
  $('#adminBody').innerHTML = h;
  $('#addUrg').onclick = () => editUrg(null);
  $('#adminBody').querySelectorAll('[data-uid]').forEach(b => b.onclick = () => editUrg(b.dataset.uid));
}
function editUrg(id){
  const u = id ? S.admin.urgences.find(x=>x.id===id) : {client:'',site:'',libelle:'',numero:'',remarque:''};
  const clients = [...S.admin.pdp.map(p=>p.client), ...S.admin.urgences.map(x=>x.client)];
  let h = datalist('dlUClient', clients) + datalist('dlUSite', [...S.admin.pdp.map(p=>p.site), ...S.admin.urgences.map(x=>x.site)])
    + datalist('dlULib', ['PC sécurité','Poste de garde','Service HSE','Salle de contrôle','Infirmerie','Pompiers du site','Responsable de site', ...S.admin.urgences.map(x=>x.libelle)]);
  h += fld('Client *','client',u.client,{list:'dlUClient',req:true,hint:'Même orthographe que dans les PDP pour que le numéro s’affiche aussi sur la fiche PDP du client.'});
  h += fld('Site','site',u.site,{list:'dlUSite'});
  h += fld('Libellé','libelle',u.libelle,{list:'dlULib',ph:'PC sécurité, poste de garde…'});
  h += fld('Numéro *','numero',u.numero,{type:'tel',req:true,ph:'02 35 00 00 00'});
  h += fld('Remarque','remarque',u.remarque,{type:'textarea',ph:'Horaires, poste interne, consigne particulière…'});
  h += `<button class="btn" id="saveUrg">Enregistrer</button>`;
  if (id) h += `<button class="btn danger" id="delUrg">Supprimer ce numéro</button>`;
  openPanel(id ? 'Modifier le numéro' : 'Nouveau numéro d’urgence', h);
  watchDirty();
  $('#saveUrg').onclick = async (e) => {
    const v = formVals();
    if (!v.client || !v.numero){ toast('Client et numéro sont obligatoires'); return; }
    e.target.disabled = true; e.target.textContent = 'Enregistrement…';
    try{ await api('saveUrg',{pin:S.pin, p:{...v, id:id||''}}); S.dirty=false; back(); toast('Numéro enregistré'); renderAdmin(); refresh(); }
    catch(err){ toast(err.message); e.target.disabled=false; e.target.textContent='Enregistrer'; }
  };
  if (id) $('#delUrg').onclick = async () => {
    if (!confirm('Supprimer ce numéro d’urgence ?')) return;
    try{ await api('deleteUrg',{pin:S.pin,id}); S.dirty=false; back(); toast('Numéro supprimé'); renderAdmin(); refresh(); }
    catch(err){ toast(err.message); }
  };
}

/* ---------- Gestion demandes de FDS ---------- */
function renderAdminDem(){
  const all = S.admin.demandes || [];
  const f = S.dfilter || 'todo';
  const list = all.filter(d => f==='all' || (f==='todo' ? d.statut!=='Traitée' : d.statut==='Traitée'));
  let h = `<div class="chips">${[['todo','À traiter'],['done','Traitées'],['all','Toutes']].map(([k,l]) =>
    `<button class="chip" data-df="${k}" aria-pressed="${k===f}">${l}<span class="n">${all.filter(d => k==='all' || (k==='todo' ? d.statut!=='Traitée' : d.statut==='Traitée')).length}</span></button>`).join('')}</div>`;
  h += list.length ? `<div class="list">${list.map(d => `
    <button class="row" data-did="${esc(d.id)}"><div class="row-main"><div class="row-title">${esc(d.produit)}</div>
    <div class="row-sub">${esc(d.fabricant)}, demandé par ${esc(d.demandeur)} le ${fr(d.date)}</div></div>
    <div class="side"><span class="badge ${d.statut==='Traitée'?'b-ok':'b-warn'}">${esc(d.statut||'À traiter')}</span></div></button>`).join('')}</div>`
    : `<div class="empty"><b>Aucune demande</b>${f==='todo'?'Toutes les demandes ont été traitées.':''}</div>`;
  $('#adminBody').innerHTML = h;
  $('#adminBody').querySelectorAll('[data-df]').forEach(b => b.onclick = () => { S.dfilter = b.dataset.df; renderAdminDem(); });
  $('#adminBody').querySelectorAll('[data-did]').forEach(b => b.onclick = () => showDemande(b.dataset.did));
}
function showDemande(id){
  const d = S.admin.demandes.find(x=>x.id===id); if (!d) return;
  const done = d.statut==='Traitée';
  let h = `<h1 class="title">${esc(d.produit)}</h1><p class="muted">${esc(d.fabricant)}</p>
    <div class="card"><dl class="kv"><dt>Demandeur</dt><dd>${esc(d.demandeur)}</dd><dt>Date</dt><dd>${fr(d.date)}</dd>
    ${d.usage?`<dt>Usage</dt><dd>${esc(d.usage)}</dd>`:''}${d.commentaire?`<dt>Commentaire</dt><dd class="pre">${esc(d.commentaire)}</dd>`:''}
    ${d.photo?`<dt>Photo</dt><dd>${esc(d.photo)}</dd>`:''}<dt>Statut</dt><dd>${esc(d.statut||'À traiter')}${d.traitee?' le '+fr(d.traitee):''}</dd></dl></div>`;
  if (!done) h += `<button class="btn" id="demCreate">Créer la fiche FDS</button>`;
  h += `<button class="btn secondary" id="demToggle">${done ? 'Remettre à traiter' : 'Marquer traitée sans créer de fiche'}</button>`;
  openPanel('Demande de FDS', h);
  if (!done) $('#demCreate').onclick = () => { editFds(null, {nom:d.produit, fabricant:d.fabricant, demandeId:d.id}); };
  $('#demToggle').onclick = async (e) => {
    e.target.disabled = true;
    try{ await api('traiterDemande',{pin:S.pin, id, statut: done ? 'À traiter' : 'Traitée'}); back(); toast('Demande mise à jour'); renderAdmin(); }
    catch(err){ toast(err.message); e.target.disabled = false; }
  };
}
